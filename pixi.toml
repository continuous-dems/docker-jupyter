[workspace]
authors = ["Matt Fisher <mfisher87@gmail.com>"]
channels = ["conda-forge", "nodefaults"]
name = "cudem-docker-image"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# IMPORTANT: Currently locking to 3.13 because globato isn't on Conda Forge yet.
#            Since we get it from PyPI, we have to use its dependencies from PyPI too.
#            Fiona doesn't build wheels for Python 3.14.
python = "3.13.*"

# Continuous DEMs!
# NOTE: pinned to exact version so we control it manually
globato = "==0.3.4"
ivert = "==0.6.7"
fetchez = "==0.8.2"
transformez = "==0.5.5"

# Jupyter
jupyterhub-singleuser = "*"
jupyterlab = ">=4.4.2"
jupyterlab-favorites = "*"
jupyterlab-geojson = "*"
jupyterlab-git = "*"
jupyterlab-myst = "*"
mystmd = "*"
nbdime = "*"

# Util
gh = "*"
gh-scoped-creds = "*"
git = "*"

# Data
gdal = "*"
geopandas = "*"
geos = "*"
h5netcdf = "*"
h5py = "*"
numpy = "*"
pandas = "*"
pystac-client = "*"
rasterio = "*"
rioxarray = "*"
scipy = "*"
shapely = "*"
xarray = "*"

# Viz
folium = "*"
hvplot = "*"
ipympl = "*"
leafmap = "*"
matplotlib = "*"

# Other
jupytergis = ">=0.15.0"
pre-commit = "*"
ruff = "*"
typst = "*"
urllib3 = "~=1.26.19"
